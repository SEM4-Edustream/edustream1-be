server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-connections: 8192
    connection-timeout: 20000
    min-spare-threads: 10
    reject-illegal-header-name: true
    reject-illegal-header-value: true
    relaxed-query-chars: "[,],|"
    relaxed-path-chars: "[,],|"
    max-parameter-count: 10000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
  messages:
    encoding: UTF-8
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:3600}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:36000}

payos:
  client-id: ${PAYOS_CLIENT_ID:dummy-client-id}
  api-key: ${PAYOS_API_KEY:dummy-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:dummy-checksum-key}

aws:
  s3:
    region: ${AWS_S3_REGION:ap-southeast-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    bucket: ${AWS_S3_BUCKET:dummy-bucket}
    document-bucket: ${AWS_S3_DOCUMENT_BUCKET:dummy-doc-bucket}
    access-key: ${AWS_ACCESS_KEY:dummy-access}
    secret-key: ${AWS_SECRET_KEY:dummy-secret}

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}

gemini:
  api:
    key: ${GEMINI_API_KEY:PLACEHOLDER_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=